
[package]
name = "wasm-bindings"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
console_error_panic_hook = { version = "0.1.7", optional = true }
serde = { version = "1.0", features = ["derive"] }
proj4rs = "0.1.8"
serde_json = "1.0.117"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["console"] }
